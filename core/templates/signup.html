{% load static %}
<!DOCTYPE html>
<html lang="fa" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - CONFESS</title>

    <style>
        body {
            background-color: #050505;
            color: #ededed;
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0; padding: 0; display: flex;
            justify-content: center; align-items: center;
            min-height: 100vh; overflow: hidden;
        }

        /* --- Background --- */
        .bg-image-container {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -2;
            background-image: url('{% static "download.jpg" %}');
            background-position: center; background-size: cover; background-repeat: no-repeat;
        }

        .bg-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(to bottom, rgba(5,5,5,0.4) 0%, rgba(5,5,5,0.8) 100%);
            z-index: -1;
        }

        /* --- Header --- */
        header {
            position: fixed; top: 0; left: 0; width: 100%; padding: 20px 40px;
            display: flex; justify-content: flex-start; align-items: center;
            z-index: 1000;
        }

        .back-btn {
            color: #ccc; text-decoration: none; font-size: 14px; font-weight: 500;
            transition: color 0.3s; text-shadow: 0 2px 10px rgba(0,0,0,0.5);
            text-transform: uppercase; letter-spacing: 2px;
        }
        .back-btn:hover { color: #fff; }

        /* --- Form Container --- */
        .form-container {
            width: 90%; max-width: 450px;
            background-color: rgba(20, 20, 24, 0.4);
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            padding: 50px 40px; border-radius: 24px;
            border: 1px solid rgba(255,255,255,0.05);
            box-shadow: 0 15px 40px rgba(0,0,0,0.6);
            box-sizing: border-box;
            animation: fadeIn 0.6s ease forwards;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        .form-title { font-size: 32px; font-weight: 600; letter-spacing: -0.02em; margin-bottom: 10px; color: #fff; text-align: center; }
        .form-subtitle { font-size: 14px; color: #888; text-align: center; margin-bottom: 35px; }

        /* --- Inputs --- */
        .input-group { margin-bottom: 25px; }
        .input-group label {
            display: block; font-size: 12px; text-transform: uppercase;
            letter-spacing: 1.5px; color: #a3a1ad; margin-bottom: 10px; font-weight: 500;
        }

        input[type="text"], input[type="password"] {
            width: 100%; background: rgba(15, 15, 18, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff; padding: 15px; border-radius: 12px; font-family: inherit; font-size: 16px;
            box-sizing: border-box; transition: border-color 0.3s, box-shadow 0.3s;
        }
        input[type="text"]:focus, input[type="password"]:focus {
            outline: none; border-color: #8b5cf6; box-shadow: 0 0 15px rgba(139, 92, 246, 0.2);
        }

        /* --- Avatar Selection --- */
        .avatar-group { margin-bottom: 35px; }
        .avatar-group label {
            display: block; font-size: 12px; text-transform: uppercase;
            letter-spacing: 1.5px; color: #a3a1ad; margin-bottom: 15px; font-weight: 500; text-align: center;
        }

        .avatars-container {
            display: flex; justify-content: center; gap: 30px;
        }

        .avatar-option {
            position: relative; cursor: pointer;
        }

        /* مخفی کردن دکمه رادیویی اصلی */
        .avatar-option input[type="radio"] { display: none; }

        .avatar-image {
            width: 80px; height: 80px; border-radius: 50%; object-fit: cover;
            border: 3px solid transparent; opacity: 0.6;
            transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
            background-color: #1a1a1e; /* رنگ پس‌زمینه تا زمانی که عکس اصلی بیاید */
        }

        .avatar-option:hover .avatar-image { opacity: 0.8; transform: scale(1.05); }

        /* وقتی آواتار انتخاب می‌شود */
        .avatar-option input[type="radio"]:checked + .avatar-image {
            border-color: #8b5cf6; opacity: 1; transform: scale(1.1);
            box-shadow: 0 0 20px rgba(139, 92, 246, 0.4);
        }

        /* --- Submit Button --- */
        .submit-btn {
            width: 100%; background: #fff; color: #000; border: none; padding: 16px; border-radius: 12px;
            font-size: 16px; font-weight: 600; letter-spacing: 0.5px; cursor: pointer; transition: all 0.3s ease;
        }
        .submit-btn:hover {
            background: #8b5cf6; color: #fff; transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(139, 92, 246, 0.3);
        }

        /* پیام خطای فرم (مثل نام کاربری تکراری) */
        .error-message {
            color: #ff3b1d; font-size: 13px; text-align: center; margin-bottom: 15px; display: none;
        }
    </style>
</head>
<body>

    <!-- Background -->
    <div class="bg-image-container"></div>
    <div class="bg-overlay"></div>

    <!-- Header -->
    <header>
        <a href="{% url 'landing' %}" class="back-btn">← Home</a>
    </header>

    <!-- Sign Up Form -->
    <div class="form-container">
        <div class="form-title">Join CONFESS</div>
        <div class="form-subtitle">Choose an identity. Remain unseen.</div>

        <form method="POST" action="">
            {% csrf_token %}

            {% if error %}
                <p class="error-message" style="display: block;">{{ error }}</p>
            {% endif %}

            <div class="input-group">
                <label for="username">Username</label>
                <input type="text" name="username" id="username" placeholder="e.g. ShadowWalker" required autocomplete="off">
            </div>

            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" name="password" id="password" placeholder="••••••••" required>
            </div>

            <!-- Avatar Selection -->
            <div class="avatar-group">
                <label>Choose your Avatar</label>
               <div class="avatars-container">

                    <label class="avatar-option">
                        <input type="radio" name="avatar" value="mangel" required checked>
                        <img src="{% static 'mangel.jpg' %}" alt="Dark Angel" class="avatar-image">
                    </label>

                    <label class="avatar-option">
                        <input type="radio" name="avatar" value="mdevil" required>
                        <img src="{% static 'mdevil.jpg' %}" alt="Devil" class="avatar-image">
                    </label>

                </div>
            </div>

            <button type="submit" class="submit-btn">Create Identity</button>
        </form>
    </div>

</body>
</html>
