{% load static %}
<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Write - CONFESS</title>

    <!-- تنظیمات Import Map برای استفاده از ماژول‌های مدرن Three.js -->
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.150.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.150.0/examples/jsm/"
        }
      }
    </script>

    <style>
        body {
            background-color: #050505;
            color: #ededed;
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0; padding: 0; display: flex;
            justify-content: center; align-items: center;
            min-height: 100vh; overflow: hidden;
        }

        #three-canvas-container {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -2;
        }

        .bg-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(to bottom, rgba(5,5,5,0.1) 0%, rgba(5,5,5,0.7) 100%);
            z-index: -1; pointer-events: none;
        }

        /* --- Header (کاملاً شفاف شده) --- */
        header {
            position: fixed; top: 0; left: 0; width: 100%; padding: 20px 40px;
            display: flex; justify-content: flex-start; align-items: center;
            background: transparent; /* کاملاً شفاف */
            border-bottom: none; /* حذف خط پایین */
            box-sizing: border-box; z-index: 1000;
        }

        .nav-links { display: flex; gap: 25px; align-items: center; }
        .nav-links a { color: #ccc; text-decoration: none; font-size: 14px; font-weight: 500; transition: color 0.3s; text-shadow: 0 2px 10px rgba(0,0,0,0.5); }
        .nav-links a:hover { color: #fff; }
        .nav-links a.signup-btn { background: rgba(139, 92, 246, 0.15); color: #8b5cf6; padding: 6px 16px; border-radius: 20px; font-weight: 600; transition: all 0.2s; text-shadow: none; border: 1px solid rgba(139, 92, 246, 0.3); }
        .nav-links a.signup-btn:hover { background: #8b5cf6; color: white; border-color: transparent; box-shadow: 0 0 15px rgba(139, 92, 246, 0.4); }

        /* --- Form Container --- */
        .form-container {
            width: 90%; max-width: 550px; background-color: transparent;
            backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
            padding: 50px 40px; border-radius: 24px;
            border: 1px solid rgba(255,255,255,0.03);
            box-shadow: 0 10px 40px rgba(0,0,0,0.6);
            box-sizing: border-box; margin-top: 60px;
            animation: fadeIn 0.8s ease forwards; position: relative; z-index: 10;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }

        .form-title { font-size: 32px; font-weight: 600; letter-spacing: -0.02em; margin-bottom: 10px; color: #fff; text-align: center; }
        .form-subtitle { font-size: 14px; color: #888; text-align: center; margin-bottom: 40px; }
        .input-group { margin-bottom: 30px; position: relative; }
        .input-group label { display: block; font-size: 12px; text-transform: uppercase; letter-spacing: 1.5px; color: #a3a1ad; margin-bottom: 10px; font-weight: 500; }

        /* --- Custom Animated Dropdown --- */
        .dropdown-wrapper { position: relative; width: 100%; user-select: none; }
        .dropdown-trigger {
            background: rgba(15, 15, 18, 0.7); border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff; padding: 15px; border-radius: 12px; font-size: 16px;
            display: flex; justify-content: space-between; align-items: center;
            cursor: pointer; transition: all 0.3s ease;
        }
        .dropdown-trigger:hover { border-color: rgba(255, 255, 255, 0.3); }
        .dropdown-trigger.active { border-color: #8b5cf6; box-shadow: 0 0 15px rgba(139, 92, 246, 0.2); }

        .trigger-text { display: flex; align-items: center; gap: 10px; }
        .trigger-icon { transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1); }
        .dropdown-trigger.active .trigger-icon { transform: rotate(180deg); }

        .dropdown-menu {
            position: absolute; top: calc(100% + 8px); left: 0; right: 0;
            background: rgba(15, 15, 18, 0.95); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 14px;
            padding: 8px; box-shadow: 0 15px 35px rgba(0,0,0,0.6);
            z-index: 100; opacity: 0; visibility: hidden; transform: scale(0.95) translateY(-10px);
            transform-origin: top center; transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .dropdown-wrapper.open .dropdown-menu { opacity: 1; visibility: visible; transform: scale(1) translateY(0); }

        .dropdown-list { list-style: none; padding: 0; margin: 0; position: relative; }
        .dropdown-item {
            position: relative; display: flex; align-items: center; gap: 12px;
            padding: 10px 12px; cursor: pointer; color: #a3a1ad; font-size: 14px; font-weight: 500;
            transition: color 0.2s ease; z-index: 2;
            opacity: 0; transform: translateX(8px); transition: opacity 0.3s ease, transform 0.3s ease, color 0.2s ease;
        }
        .dropdown-wrapper.open .dropdown-item { opacity: 1; transform: translateX(0); }
        .dropdown-item:hover, .dropdown-item.selected { color: #fff; }

        .hover-indicator {
            position: absolute; top: 0; left: 0; width: 100%; height: 40px;
            background: rgba(255, 255, 255, 0.05); border-radius: 8px; pointer-events: none; opacity: 0; z-index: 1;
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.2s ease;
        }
        .left-bar {
            position: absolute; left: 0; top: 50%; transform: translateY(-50%);
            width: 3px; height: 18px; background: #8b5cf6; border-radius: 3px;
        }

        /* --- Textarea --- */
        textarea {
            width: 100%; background: rgba(15, 15, 18, 0.7); border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff; padding: 15px; border-radius: 12px; font-family: inherit; font-size: 16px;
            box-sizing: border-box; resize: none; height: 160px; line-height: 1.6; transition: border-color 0.3s, box-shadow 0.3s;
        }
        textarea:focus { outline: none; border-color: #8b5cf6; box-shadow: 0 0 15px rgba(139, 92, 246, 0.2); }

        .char-counter { position: absolute; bottom: -22px; right: 0; font-size: 12px; color: #6a6873; font-family: monospace; }
        .char-counter.limit-reached { color: #ff3b1d; }

        .submit-btn {
            width: 100%; background: #fff; color: #000; border: none; padding: 16px; border-radius: 12px;
            font-size: 16px; font-weight: 600; letter-spacing: 0.5px; cursor: pointer; transition: all 0.3s ease; margin-top: 10px;
        }
        .submit-btn:hover { background: #8b5cf6; color: #fff; transform: translateY(-2px); box-shadow: 0 10px 20px rgba(139, 92, 246, 0.3); }

        .hidden-real-select { position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none; }
    </style>
</head>
<body>

    <!-- کانتینر رندر Three.js -->
    <div id="three-canvas-container"></div>
    <div class="bg-overlay"></div>

    <header>
        <div class="nav-links">
            <a href="{% url 'landing' %}">Home</a>
            <a href="{% url 'choose_category' %}">Read</a>
            {% if user.is_authenticated %}
                <a href="{% url 'logout' %}" class="signup-btn" style="background: rgba(255, 59, 29, 0.15); color: #ff3b1d;">Logout</a>
            {% else %}
                <a href="{% url 'login' %}">Log In</a>
                <a href="{% url 'signup' %}" class="signup-btn">Sign Up</a>
            {% endif %}
        </div>
    </header>

    <div class="form-container">
        <div class="form-title">Confess</div>
        <div class="form-subtitle">Write your story. Remain anonymous.</div>

        <!-- فرم متصل به بک‌اند جنگو -->
        <form method="POST" action="">
            {% csrf_token %}

            <div class="input-group">
                <label>Category</label>

                <select name="category" id="realCategorySelect" class="hidden-real-select" required>
                    <option value="" disabled selected>Select a category...</option>
                    {% for cat in categories %}
                        <option value="{{ cat.id }}">{{ cat.name }}</option>
                    {% endfor %}
                </select>

                <div class="dropdown-wrapper" id="dropdownWrapper">
                    <div class="dropdown-trigger" id="dropdownTrigger">
                        <span class="trigger-text" id="triggerText">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#a3a1ad" stroke-width="1.5"><path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.93a2 2 0 0 1-1.66-.9l-.82-1.2A2 2 0 0 0 8.93 3H4a2 2 0 0 0-2 2v13c0 1.1.9 2 2 2Z"/></svg>
                            Select Category...
                        </span>
                        <svg class="trigger-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#888" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg>
                    </div>

                    <div class="dropdown-menu">
                        <ul class="dropdown-list" id="dropdownList">
                            <div class="hover-indicator" id="hoverIndicator">
                                <div class="left-bar"></div>
                            </div>

                            {% for cat in categories %}
                            <li class="dropdown-item" data-value="{{ cat.id }}" data-name="{{ cat.name }}">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline></svg>
                                {{ cat.name }}
                            </li>
                            {% endfor %}
                        </ul>
                    </div>
                </div>
            </div>

            <div class="input-group">
                <label for="text">Your Story</label>
                <textarea name="text" id="text" maxlength="280" placeholder="Type here..." required></textarea>
                <div class="char-counter" id="char-count">0 / 280</div>
            </div>

            <button type="submit" class="submit-btn">Publish</button>
        </form>
    </div>

    <!-- اسکریپت‌های مربوط به فرم (شمارنده و منوی دراپ‌داون) -->
    <script>
        const textarea = document.getElementById('text');
        const charCount = document.getElementById('char-count');
        textarea.addEventListener('input', function() {
            const currentLength = this.value.length;
            charCount.textContent = `${currentLength} / 280`;
            if (currentLength >= 280) charCount.classList.add('limit-reached');
            else charCount.classList.remove('limit-reached');
        });

        const dropdownWrapper = document.getElementById('dropdownWrapper');
        const dropdownTrigger = document.getElementById('dropdownTrigger');
        const triggerText = document.getElementById('triggerText');
        const realSelect = document.getElementById('realCategorySelect');
        const dropdownItems = document.querySelectorAll('.dropdown-item');
        const hoverIndicator = document.getElementById('hoverIndicator');
        const dropdownList = document.getElementById('dropdownList');

        dropdownTrigger.addEventListener('click', () => {
            const isOpen = dropdownWrapper.classList.contains('open');
            if (!isOpen) {
                dropdownWrapper.classList.add('open');
                dropdownTrigger.classList.add('active');
                dropdownItems.forEach((item, index) => {
                    item.style.transitionDelay = `${0.05 + (index * 0.03)}s`;
                });
            } else { closeDropdown(); }
        });

        document.addEventListener('click', (e) => {
            if (!dropdownWrapper.contains(e.target)) { closeDropdown(); }
        });

        function closeDropdown() {
            dropdownWrapper.classList.remove('open');
            dropdownTrigger.classList.remove('active');
            dropdownItems.forEach(item => item.style.transitionDelay = '0s');
        }

        dropdownItems.forEach(item => {
            item.addEventListener('mouseenter', () => {
                hoverIndicator.style.opacity = '1';
                hoverIndicator.style.transform = `translateY(${item.offsetTop}px)`;
            });

            item.addEventListener('click', function() {
                const value = this.getAttribute('data-value');
                const name = this.getAttribute('data-name');
                realSelect.value = value;
                triggerText.innerHTML = `
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.5"><path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.93a2 2 0 0 1-1.66-.9l-.82-1.2A2 2 0 0 0 8.93 3H4a2 2 0 0 0-2 2v13c0 1.1.9 2 2 2Z"/></svg>
                    <span style="color: #fff;">${name}</span>
                `;
                dropdownItems.forEach(i => i.classList.remove('selected'));
                this.classList.add('selected');
                closeDropdown();
            });
        });

        dropdownList.addEventListener('mouseleave', () => {
            hoverIndicator.style.opacity = '0';
        });
    </script>

    <!-- اسکریپت‌های Three.js برای افکت غبار نجواها (Bloom + Parallax) -->
    <script type="module">
        import * as THREE from 'three';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

        const canvasContainer = document.getElementById('three-canvas-container');

        // تنظیمات صحنه، دوربین و رندر
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x050505, 0.0015);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 5;

        const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: false });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        canvasContainer.appendChild(renderer.domElement);

        // تنظیمات افکت درخشش (Bloom)
        const renderPass = new RenderPass(scene, camera);
        const bloomPass = new UnrealBloomPass(
            new THREE.Vector2(window.innerWidth, window.innerHeight),
            2.0, // قدرت درخشش
            0.5, // شعاع
            0.1  // آستانه نور
        );

        const composer = new EffectComposer(renderer);
        composer.addPass(renderPass);
        composer.addPass(bloomPass);

        // ایجاد سیستم ذرات غبار
        const particlesGeometry = new THREE.BufferGeometry();
        const particlesCount = 3000;
        const posArray = new Float32Array(particlesCount * 3);
        const colorsArray = new Float32Array(particlesCount * 3);

        const colorPurple = new THREE.Color(0x8b5cf6);
        const colorWhite = new THREE.Color(0xffffff);
        const colorDarkPurple = new THREE.Color(0x4c1d95);

        for(let i = 0; i < particlesCount * 3; i+=3) {
            posArray[i] = (Math.random() - 0.5) * 20;
            posArray[i+1] = (Math.random() - 0.5) * 20;
            posArray[i+2] = (Math.random() - 0.5) * 20;

            const rand = Math.random();
            let mixedColor = colorPurple;
            if(rand > 0.7) mixedColor = colorWhite;
            else if(rand > 0.4) mixedColor = colorDarkPurple;

            colorsArray[i] = mixedColor.r;
            colorsArray[i+1] = mixedColor.g;
            colorsArray[i+2] = mixedColor.b;
        }

        particlesGeometry.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
        particlesGeometry.setAttribute('color', new THREE.BufferAttribute(colorsArray, 3));

        const particlesMaterial = new THREE.PointsMaterial({
            size: 0.04,
            vertexColors: true,
            transparent: true,
            opacity: 0.8,
            blending: THREE.AdditiveBlending
        });

        const particleMesh = new THREE.Points(particlesGeometry, particlesMaterial);
        scene.add(particleMesh);

        // تعامل با موس
        let mouseX = 0;
        let mouseY = 0;
        let targetX = 0;
        let targetY = 0;
        const windowHalfX = window.innerWidth / 2;
        const windowHalfY = window.innerHeight / 2;

        document.addEventListener('mousemove', (event) => {
            mouseX = (event.clientX - windowHalfX);
            mouseY = (event.clientY - windowHalfY);
        });

        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const elapsedTime = clock.getElapsedTime();

            particleMesh.rotation.y = elapsedTime * 0.02;
            particleMesh.rotation.x = elapsedTime * 0.01;

            targetX = mouseX * 0.0015;
            targetY = mouseY * 0.0015;

            camera.position.x += (targetX - camera.position.x) * 0.05;
            camera.position.y += (-targetY - camera.position.y) * 0.05;
            camera.lookAt(scene.position);

            composer.render();
        }

        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
